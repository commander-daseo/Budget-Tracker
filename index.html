<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Tracker</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f5f5f3;
    --bg3: #efefec;
    --text: #1a1a1a;
    --text2: #6b6b6b;
    --text3: #a0a0a0;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --success-bg: #eaf3de;
    --success: #3b6d11;
    --danger-bg: #fcebeb;
    --danger: #a32d2d;
    --radius: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg2: #252523;
      --bg3: #2e2e2b;
      --text: #f0ede8;
      --text2: #a09d98;
      --text3: #6b6866;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.18);
      --success-bg: #173404;
      --success: #97c459;
      --danger-bg: #501313;
      --danger: #f09595;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Helvetica Neue', sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; }

  .header { background: var(--bg); border-bottom: 0.5px solid var(--border); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 10; }
  .header h1 { font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
  .header-sub { font-size: 12px; color: var(--text2); }

  .tabs { display: flex; gap: 2px; padding: 0 24px; background: var(--bg); border-bottom: 0.5px solid var(--border); }
  .tab { padding: 12px 16px; font-size: 13px; cursor: pointer; border: none; background: none; color: var(--text2); border-bottom: 2px solid transparent; transition: all 0.15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 500; }

  .container { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  .section { display: none; }
  .section.active { display: block; }

  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
  .metric { background: var(--bg2); border-radius: var(--radius); padding: 14px 16px; }
  .metric-label { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
  .metric-value { font-size: 20px; font-weight: 500; }
  .metric-sub { font-size: 12px; margin-top: 3px; }

  .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px 20px; margin-bottom: 12px; }
  .card-title { font-size: 11px; font-weight: 500; color: var(--text2); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.06em; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  th { text-align: left; color: var(--text2); font-weight: 400; padding: 6px 8px; border-bottom: 0.5px solid var(--border); font-size: 11px; }
  td { padding: 10px 8px; border-bottom: 0.5px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; }
  .badge-in { background: var(--success-bg); color: var(--success); }
  .badge-ex { background: var(--danger-bg); color: var(--danger); }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-label { font-size: 13px; width: 110px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; height: 6px; background: var(--bg2); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; transition: width 0.4s; }
  .bar-amt { font-size: 12px; color: var(--text2); width: 90px; text-align: right; flex-shrink: 0; }

  .cmp-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 0.5px solid var(--border); flex-wrap: wrap; gap: 6px; }
  .cmp-row:last-child { border-bottom: none; }
  .cmp-vals { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .cmp-v { font-size: 12px; color: var(--text2); }

  .pos { color: var(--danger); }
  .neg { color: var(--success); }

  .month-sel { display: flex; align-items: center; gap: 8px; margin-bottom: 1.5rem; }
  .month-sel span { font-size: 13px; color: var(--text2); }
  .month-sel select { font-size: 13px; background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 6px 10px; color: var(--text); cursor: pointer; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .form-full { margin-bottom: 10px; }
  .form-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; }
  .form-group input, .form-group select { width: 100%; font-size: 13px; background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 8px 10px; color: var(--text); outline: none; }
  .form-group input:focus, .form-group select:focus { border-color: var(--text2); }

  .btn { width: 100%; padding: 10px; font-size: 13px; font-weight: 500; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--text); color: var(--bg); cursor: pointer; margin-top: 4px; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }

  .empty { text-align: center; padding: 2rem; color: var(--text3); font-size: 13px; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--success-bg); color: var(--success); font-size: 13px; padding: 10px 16px; border-radius: var(--radius); border: 0.5px solid var(--success); opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
  .toast.show { opacity: 1; }

  .del-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 16px; padding: 0 4px; }
  .del-btn:hover { color: var(--danger); }
</style>
</head>
<body>

<div class="header">
  <h1>Budget Tracker</h1>
  <span class="header-sub" id="header-date"></span>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('records',this)">Records</button>
  <button class="tab" onclick="switchTab('summary',this)">Monthly summary</button>
  <button class="tab" onclick="switchTab('compare',this)">Comparison</button>
  <button class="tab" onclick="switchTab('add',this)">+ Add</button>
</div>

<div class="container">

  <div id="records" class="section active">
    <div class="month-sel">
      <span>Month:</span>
      <select id="rec-month-sel" onchange="renderRecords()"></select>
    </div>
    <div class="metric-grid" id="rec-metrics"></div>
    <div class="card">
      <div class="card-title">Transactions</div>
      <div id="rec-table-wrap"></div>
    </div>
  </div>

  <div id="summary" class="section">
    <div class="month-sel">
      <span>Month:</span>
      <select id="sum-month-sel" onchange="renderSummary()"></select>
    </div>
    <div class="metric-grid" id="sum-metrics"></div>
    <div class="card">
      <div class="card-title">Expense by category</div>
      <div id="sum-bars"></div>
    </div>
  </div>

  <div id="compare" class="section">
    <div class="month-sel">
      <span>Compare:</span>
      <select id="cmp-sel" onchange="renderCompare()"></select>
    </div>
    <div class="metric-grid" id="cmp-metrics"></div>
    <div class="card">
      <div class="card-title">Category breakdown</div>
      <div id="cmp-rows"></div>
    </div>
  </div>

  <div id="add" class="section">
    <div class="card">
      <div class="card-title">New transaction</div>
      <div class="form-grid">
        <div class="form-group"><label>Date</label><input type="date" id="f-date"></div>
        <div class="form-group"><label>Type</label>
          <select id="f-type" onchange="updateCats()">
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
          </select>
        </div>
      </div>
      <div class="form-grid">
        <div class="form-group"><label>Category</label><select id="f-cat"></select></div>
        <div class="form-group"><label>Amount (¥)</label><input type="number" id="f-amt" min="0" placeholder="0"></div>
      </div>
      <div class="form-full form-group"><label>Note</label><input type="text" id="f-note" placeholder="특이사항 (선택)"></div>
      <button class="btn" onclick="addTransaction()">Save transaction</button>
    </div>
    <div class="card">
      <div class="card-title">Recent entries</div>
      <div id="recent-add"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast">저장됨</div>

<script>
const CATS = {
  Income: ['Monthly Allowance','Bonus'],
  Expense: ['Food','Appearance','Entertainment','Other']
};
const CAT_COLORS = {
  Food:'#1D9E75', Appearance:'#7F77DD',
  Entertainment:'#D85A30', Other:'#888780',
  'Monthly Allowance':'#378ADD', Bonus:'#BA7517'
};

function load() {
  try { return JSON.parse(localStorage.getItem('bt-data') || '[]'); } catch(e) { return []; }
}
function save(data) {
  localStorage.setItem('bt-data', JSON.stringify(data));
}
function fmt(n) { return '¥' + Math.round(n).toLocaleString(); }
function getMonths(data) {
  const s = new Set(data.map(t => t.date.slice(0,7)));
  return [...s].sort().reverse();
}
function monthLabel(m) {
  const [y,mo] = m.split('-');
  return `${y}년 ${parseInt(mo)}월`;
}
function populateSel(selId, months) {
  const el = document.getElementById(selId);
  if (!el) return;
  const cur = el.value;
  el.innerHTML = months.map(m => `<option value="${m}">${monthLabel(m)}</option>`).join('');
  if (months.includes(cur)) el.value = cur;
}
function calcMonth(data, month) {
  const rows = data.filter(t => t.date.startsWith(month));
  const income = rows.filter(t => t.type==='Income').reduce((s,t) => s+t.amount, 0);
  const expense = rows.filter(t => t.type==='Expense').reduce((s,t) => s+t.amount, 0);
  const byCat = {};
  rows.filter(t => t.type==='Expense').forEach(t => { byCat[t.cat] = (byCat[t.cat]||0) + t.amount; });
  return { rows, income, expense, net: income-expense, byCat };
}

function switchTab(id, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  renderAll();
}

function renderRecords() {
  const data = load();
  const months = getMonths(data);
  populateSel('rec-month-sel', months);
  const month = document.getElementById('rec-month-sel').value || months[0];
  if (!month) {
    document.getElementById('rec-metrics').innerHTML = '';
    document.getElementById('rec-table-wrap').innerHTML = '<div class="empty">아직 데이터가 없습니다.<br>+ Add 탭에서 입력하세요.</div>';
    return;
  }
  const {rows, income, expense, net} = calcMonth(data, month);
  document.getElementById('rec-metrics').innerHTML = `
    <div class="metric"><div class="metric-label">Total income</div><div class="metric-value" style="color:var(--success)">${fmt(income)}</div></div>
    <div class="metric"><div class="metric-label">Total expense</div><div class="metric-value" style="color:var(--danger)">${fmt(expense)}</div></div>
    <div class="metric"><div class="metric-label">Net</div><div class="metric-value">${fmt(net)}</div></div>`;
  if (!rows.length) { document.getElementById('rec-table-wrap').innerHTML = '<div class="empty">이달 데이터 없음</div>'; return; }
  const sorted = [...rows].sort((a,b) => b.date.localeCompare(a.date));
  document.getElementById('rec-table-wrap').innerHTML = `<table>
    <thead><tr><th style="width:65px">Date</th><th style="width:60px">Type</th><th style="width:120px">Category</th><th style="text-align:right;width:85px">Amount</th><th>Note</th><th style="width:30px"></th></tr></thead>
    <tbody>${sorted.map(t => `<tr>
      <td>${t.date.slice(5)}</td>
      <td><span class="badge ${t.type==='Income'?'badge-in':'badge-ex'}">${t.type}</span></td>
      <td>${t.cat}</td>
      <td style="text-align:right;color:${t.type==='Income'?'var(--success)':'var(--danger)'}">${t.type==='Income'?'+':'-'}${fmt(t.amount)}</td>
      <td style="color:var(--text2);font-size:12px">${t.note||'—'}</td>
      <td><button class="del-btn" onclick="deleteEntry(${t.id})">×</button></td>
    </tr>`).join('')}</tbody></table>`;
}

function renderSummary() {
  const data = load();
  const months = getMonths(data);
  populateSel('sum-month-sel', months);
  const month = document.getElementById('sum-month-sel').value || months[0];
  if (!month) { document.getElementById('sum-metrics').innerHTML=''; document.getElementById('sum-bars').innerHTML='<div class="empty">아직 데이터가 없습니다.</div>'; return; }
  const {income, expense, net, byCat} = calcMonth(data, month);
  const savingsRate = income ? Math.round(net/income*100) : null;
  document.getElementById('sum-metrics').innerHTML = `
    <div class="metric"><div class="metric-label">Total income</div><div class="metric-value" style="color:var(--success)">${fmt(income)}</div></div>
    <div class="metric"><div class="metric-label">Total expense</div><div class="metric-value" style="color:var(--danger)">${fmt(expense)}</div></div>
    <div class="metric"><div class="metric-label">Net</div><div class="metric-value">${fmt(net)}</div></div>
    <div class="metric"><div class="metric-label">Savings rate</div><div class="metric-value">${savingsRate!==null?savingsRate+'%':'—'}</div></div>`;
  const maxExp = Math.max(...Object.values(byCat), 1);
  const bars = CATS.Expense.map(cat => {
    const amt = byCat[cat]||0;
    const pct = expense ? Math.round(amt/expense*100) : 0;
    return `<div class="bar-row">
      <div class="bar-label">${cat}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(amt/maxExp*100)}%;background:${CAT_COLORS[cat]}"></div></div>
      <div class="bar-amt">${fmt(amt)} <span style="color:var(--text3);font-size:11px">${pct}%</span></div>
    </div>`;}).join('');
  document.getElementById('sum-bars').innerHTML = bars || '<div class="empty">지출 없음</div>';
}

function renderCompare() {
  const data = load();
  const months = getMonths(data);
  const sel = document.getElementById('cmp-sel');
  if (months.length < 2) {
    sel.innerHTML = '<option>데이터 부족</option>';
    document.getElementById('cmp-metrics').innerHTML = '';
    document.getElementById('cmp-rows').innerHTML = '<div class="empty">비교하려면 최소 2개월 데이터가 필요합니다.</div>';
    return;
  }
  const pairs = [];
  for (let i=0; i<months.length-1; i++) pairs.push([months[i], months[i+1]]);
  const curVal = sel.value;
  sel.innerHTML = pairs.map(([a,b]) => `<option value="${a}|${b}">${monthLabel(b)} vs ${monthLabel(a)}</option>`).join('');
  if (pairs.map(p=>p.join('|')).includes(curVal)) sel.value = curVal;
  const [curM, prevM] = (sel.value || pairs[0].join('|')).split('|');
  const cur = calcMonth(data, curM);
  const prev = calcMonth(data, prevM);
  const diff = cur.expense - prev.expense;
  const pct = prev.expense ? ((diff/prev.expense)*100).toFixed(1) : null;
  document.getElementById('cmp-metrics').innerHTML = `
    <div class="metric"><div class="metric-label">${monthLabel(prevM)}</div><div class="metric-value">${fmt(prev.expense)}</div></div>
    <div class="metric"><div class="metric-label">${monthLabel(curM)}</div><div class="metric-value">${fmt(cur.expense)}</div></div>
    <div class="metric"><div class="metric-label">Difference</div><div class="metric-value ${diff>0?'pos':'neg'}">${diff>0?'+':''}${fmt(Math.abs(diff))}</div>${pct?`<div class="metric-sub ${diff>0?'pos':'neg'}">${diff>0?'+':''}${pct}%</div>`:''}</div>`;
  const rows = CATS.Expense.map(cat => {
    const a = cur.byCat[cat]||0; const b = prev.byCat[cat]||0; const d = a-b;
    const p = b ? ((d/b)*100).toFixed(1) : null;
    return `<div class="cmp-row">
      <div style="font-size:13px">${cat}</div>
      <div class="cmp-vals">
        <div class="cmp-v">${monthLabel(prevM)}: ${fmt(b)}</div>
        <div class="cmp-v">${monthLabel(curM)}: ${fmt(a)}</div>
        <div style="font-size:13px;font-weight:500" class="${d>0?'pos':'neg'}">${d>0?'+':''}${fmt(Math.abs(d))}${p?' ('+(d>0?'+':'')+p+'%)':''}</div>
      </div>
    </div>`;}).join('');
  document.getElementById('cmp-rows').innerHTML = rows;
}

function updateCats() {
  const type = document.getElementById('f-type').value;
  document.getElementById('f-cat').innerHTML = (CATS[type]||[]).map(c=>`<option>${c}</option>`).join('');
}

function addTransaction() {
  const date = document.getElementById('f-date').value;
  const type = document.getElementById('f-type').value;
  const cat = document.getElementById('f-cat').value;
  const amt = parseFloat(document.getElementById('f-amt').value);
  const note = document.getElementById('f-note').value.trim();
  if (!date || !amt || amt <= 0) return;
  const data = load();
  data.push({ id: Date.now(), date, type, cat, amount: amt, note });
  save(data);
  document.getElementById('f-amt').value = '';
  document.getElementById('f-note').value = '';
  showToast();
  renderRecent();
}

function deleteEntry(id) {
  const data = load().filter(t => t.id !== id);
  save(data);
  renderAll();
}

function renderRecent() {
  const data = load();
  const recent = [...data].sort((a,b) => b.id-a.id).slice(0,5);
  if (!recent.length) { document.getElementById('recent-add').innerHTML='<div class="empty">아직 없음</div>'; return; }
  document.getElementById('recent-add').innerHTML=`<table>
    <thead><tr><th style="width:65px">Date</th><th style="width:120px">Category</th><th style="text-align:right">Amount</th><th style="width:30px"></th></tr></thead>
    <tbody>${recent.map(t=>`<tr>
      <td>${t.date.slice(5)}</td><td>${t.cat}</td>
      <td style="text-align:right;color:${t.type==='Income'?'var(--success)':'var(--danger)'}">${t.type==='Income'?'+':'-'}${fmt(t.amount)}</td>
      <td><button class="del-btn" onclick="deleteEntry(${t.id})">×</button></td>
    </tr>`).join('')}</tbody></table>`;
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function renderAll() {
  renderRecords();
  renderSummary();
  renderCompare();
  renderRecent();
}

document.getElementById('header-date').textContent = new Date().toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric'});
const fd = document.getElementById('f-date');
fd.value = new Date().toISOString().slice(0,10);
updateCats();
renderAll();
</script>
</body>
</html>
